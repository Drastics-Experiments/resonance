name: macOS

on:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - "mac/**"
      - "installers/macos/**"
      - "release/version.json"
      - "scripts/release-now.mjs"
      - "scripts/release-now.test.mjs"
      - "scripts/release-version.mjs"
      - "scripts/record-desktop-signing-evidence.mjs"
      - "scripts/validate-release-assets.mjs"
      - "scripts/validate-release-assets.test.mjs"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "windows/**"
      - "mac/**"
      - "installers/macos/**"
      - "release/version.json"
      - "scripts/release-now.mjs"
      - "scripts/release-now.test.mjs"
      - "scripts/release-version.mjs"
      - "scripts/record-desktop-signing-evidence.mjs"
      - "scripts/validate-release-assets.mjs"
      - "scripts/validate-release-assets.test.mjs"
      - ".github/workflows/macos.yml"
  workflow_call:
    inputs:
      release_candidate:
        required: false
        type: boolean
        default: false
      production_signing:
        description: Permit production signing only from the protected direct-release workflow.
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      build_number:
        required: false
        type: string
        default: ""
      version_override:
        description: Apply version and build inputs inside the runner without changing repository source.
        required: false
        type: boolean
        default: false
      source_ref:
        required: false
        type: string
        default: ""
    secrets:
      RESONANCE_MACOS_APP_CERTIFICATE_BASE64:
        required: false
      RESONANCE_MACOS_APP_CERTIFICATE_PASSWORD:
        required: false
      RESONANCE_MACOS_APP_IDENTITY:
        required: false
      RESONANCE_MACOS_INSTALLER_CERTIFICATE_BASE64:
        required: false
      RESONANCE_MACOS_INSTALLER_CERTIFICATE_PASSWORD:
        required: false
      RESONANCE_MACOS_INSTALLER_IDENTITY:
        required: false
      RESONANCE_MACOS_NOTARY_KEY_BASE64:
        required: false
      RESONANCE_MACOS_NOTARY_KEY_ID:
        required: false
      RESONANCE_MACOS_NOTARY_ISSUER_ID:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.release_candidate || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: macos-26
    environment: ${{ inputs.production_signing && 'production-release' || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Apply direct candidate version
        if: ${{ inputs.release_candidate && inputs.version_override }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: node scripts/release-version.mjs --set "$EXPECTED_VERSION" "$EXPECTED_BUILD"

      - name: Resolve and verify release version
        id: release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
          IS_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          node scripts/release-version.mjs --github-output >> "$GITHUB_OUTPUT"
          read -r VERSION BUILD < <(node -e 'const value = require("./release/version.json"); console.log(value.version, value.build)')
          if [[ "$IS_CANDIDATE" == "true" ]]; then
            [[ "$VERSION" == "$EXPECTED_VERSION" ]]
            [[ "$BUILD" == "$EXPECTED_BUILD" ]]
          fi

      - name: Validate production signing secrets
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        shell: bash
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.RESONANCE_MACOS_APP_CERTIFICATE_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.RESONANCE_MACOS_APP_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.RESONANCE_MACOS_APP_IDENTITY }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.RESONANCE_MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.RESONANCE_MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.RESONANCE_MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.RESONANCE_MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.RESONANCE_MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.RESONANCE_MACOS_NOTARY_ISSUER_ID }}
        run: |
          required=(
            APP_CERTIFICATE_BASE64
            APP_CERTIFICATE_PASSWORD
            APP_IDENTITY
            INSTALLER_CERTIFICATE_BASE64
            INSTALLER_CERTIFICATE_PASSWORD
            INSTALLER_IDENTITY
            NOTARY_KEY_BASE64
            NOTARY_KEY_ID
            NOTARY_ISSUER_ID
          )
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required macOS release-signing secret: ${name}"; exit 1; }
          done
          [[ "$APP_IDENTITY" == "Developer ID Application:"* ]] || {
            echo "::error::RESONANCE_MACOS_APP_IDENTITY must name a Developer ID Application identity."
            exit 1
          }
          [[ "$INSTALLER_IDENTITY" == "Developer ID Installer:"* ]] || {
            echo "::error::RESONANCE_MACOS_INSTALLER_IDENTITY must name a Developer ID Installer identity."
            exit 1
          }

      - name: Configure production signing
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        shell: bash
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.RESONANCE_MACOS_APP_CERTIFICATE_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.RESONANCE_MACOS_APP_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.RESONANCE_MACOS_APP_IDENTITY }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.RESONANCE_MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.RESONANCE_MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.RESONANCE_MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.RESONANCE_MACOS_NOTARY_KEY_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/resonance-release-signing.keychain-db"
          APP_CERTIFICATE_PATH="$RUNNER_TEMP/resonance-app-signing.p12"
          INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/resonance-installer-signing.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/resonance-notary-key.p8"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$APP_CERTIFICATE_BASE64" | base64 -D > "$APP_CERTIFICATE_PATH"
          printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$INSTALLER_CERTIFICATE_PATH"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 0600 "$APP_CERTIFICATE_PATH" "$INSTALLER_CERTIFICATE_PATH" "$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APP_CERTIFICATE_PASSWORD" -A -f pkcs12
          security import "$INSTALLER_CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq -- "$APP_IDENTITY"
          security find-certificate -a -c "$INSTALLER_IDENTITY" "$KEYCHAIN_PATH" >/dev/null

          [[ "$APP_IDENTITY" =~ \(([A-Z0-9]{10})\)$ ]] || {
            echo "::error::RESONANCE_MACOS_APP_IDENTITY must end with a ten-character Apple Team ID in parentheses."
            exit 1
          }
          UPDATE_TEAM_ID="${BASH_REMATCH[1]}"
          UPDATE_REQUIREMENT="identifier \"com.gavindietrich.LikedSongsFocus\" and anchor apple generic and certificate leaf[subject.OU] = \"$UPDATE_TEAM_ID\""
          printf 'MAC_UPDATE_TEAM_ID=%s\n' "$UPDATE_TEAM_ID" >> "$GITHUB_ENV"
          printf 'MAC_UPDATE_DESIGNATED_REQUIREMENT=%s\n' "$UPDATE_REQUIREMENT" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - name: Restore Electron packaging cache
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: resonance-macos-electron-${{ runner.arch }}-${{ hashFiles('windows/pnpm-lock.yaml') }}
          restore-keys: |
            resonance-macos-electron-${{ runner.arch }}-
            resonance-macos-electron-

      - name: Install Electron dependencies
        working-directory: windows
        run: pnpm install --frozen-lockfile

      - name: Run shared Electron tests
        working-directory: windows
        run: pnpm test

      - name: Run release policy tests
        run: >-
          node --test
          scripts/direct-release-workflow.test.mjs
          scripts/release-now.test.mjs
          scripts/validate-release-assets.test.mjs

      - name: Build Electron app and installer
        shell: bash
        run: |
          rm -rf installers/macos/dist
          MAC_ARCH=universal APP_VERSION="$APP_VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
            bash mac/scripts/build-electron.sh
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build }}
          RELEASE_BASE_URL: ${{ format('https://github.com/Drastics-Experiments/resonance/releases/download/v{0}', steps.release.outputs.version) }}
          MAC_UPDATE_AUTHENTICITY: ${{ inputs.release_candidate && inputs.production_signing && 'production' || 'development' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.release_candidate && inputs.production_signing && 'true' || 'false' }}
          CSC_LINK: ${{ inputs.release_candidate && inputs.production_signing && secrets.RESONANCE_MACOS_APP_CERTIFICATE_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.production_signing && secrets.RESONANCE_MACOS_APP_CERTIFICATE_PASSWORD || '' }}
          CSC_NAME: ${{ inputs.production_signing && secrets.RESONANCE_MACOS_APP_IDENTITY || '' }}
          CSC_INSTALLER_LINK: ${{ inputs.release_candidate && inputs.production_signing && secrets.RESONANCE_MACOS_INSTALLER_CERTIFICATE_BASE64 || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ inputs.production_signing && secrets.RESONANCE_MACOS_INSTALLER_CERTIFICATE_PASSWORD || '' }}
          CSC_INSTALLER_NAME: ${{ inputs.production_signing && secrets.RESONANCE_MACOS_INSTALLER_IDENTITY || '' }}
          APPLE_API_KEY: ${{ inputs.release_candidate && inputs.production_signing && format('{0}/resonance-notary-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ inputs.production_signing && secrets.RESONANCE_MACOS_NOTARY_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.production_signing && secrets.RESONANCE_MACOS_NOTARY_ISSUER_ID || '' }}

      - name: Verify macOS Electron artifacts
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_BUILD: ${{ steps.release.outputs.build }}
          EXPECTED_SIGNING: ${{ inputs.release_candidate && inputs.production_signing && 'production' || 'unsigned' }}
        run: |
          test -s installers/macos/dist/Resonance-macOS.zip
          test -s installers/macos/dist/Resonance-Installer.pkg
          test -s installers/macos/dist/Resonance-macOS.zip.sha256
          test -s installers/macos/dist/latest-mac.json
          node --input-type=module -e '
            import fs from "node:fs";
            const expectedVersion = process.env.EXPECTED_VERSION;
            const expectedBuild = process.env.EXPECTED_BUILD;
            const manifest = JSON.parse(fs.readFileSync("installers/macos/dist/latest-mac.json", "utf8"));
            if (manifest.version !== expectedVersion || String(manifest.build) !== String(expectedBuild)) {
              throw new Error(`latest-mac.json metadata mismatch: ${JSON.stringify(manifest)}`);
            }
          '
          unpacked="$RUNNER_TEMP/resonance-macos-unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          ditto -x -k installers/macos/dist/Resonance-macOS.zip "$unpacked"
          app="$unpacked/Resonance.app"
          test -x "$app/Contents/MacOS/Resonance"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist" | grep -Fxq com.gavindietrich.LikedSongsFocus
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" | grep -Fxq "$EXPECTED_VERSION"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Contents/Info.plist" | grep -Fxq "$EXPECTED_BUILD"
          codesign --verify --deep --strict --verbose=2 "$app"
          pkgutil --payload-files installers/macos/dist/Resonance-Installer.pkg | grep -Eq '(^|/)Resonance\.app/Contents/MacOS/Resonance$'
          if [[ "$EXPECTED_SIGNING" == "production" ]]; then
            /usr/libexec/PlistBuddy -c "Print :ResonanceUpdateAuthenticity" "$app/Contents/Info.plist" | grep -Fxq production
            /usr/libexec/PlistBuddy -c "Print :ResonanceUpdateTeamIdentifier" "$app/Contents/Info.plist" | grep -Fxq "$MAC_UPDATE_TEAM_ID"
            /usr/libexec/PlistBuddy -c "Print :ResonanceUpdateDesignatedRequirement" "$app/Contents/Info.plist" | grep -Fxq "$MAC_UPDATE_DESIGNATED_REQUIREMENT"
            spctl --assess --type execute --verbose=4 "$app"
            spctl --assess --type install --verbose=4 installers/macos/dist/Resonance-Installer.pkg
            xcrun stapler validate "$app"
            xcrun stapler validate installers/macos/dist/Resonance-Installer.pkg
          else
            /usr/libexec/PlistBuddy -c "Print :ResonanceUpdateAuthenticity" "$app/Contents/Info.plist" | grep -Fxq development
          fi

      - name: Record verified macOS signing evidence
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        run: >-
          node scripts/record-desktop-signing-evidence.mjs
          macos installers/macos/dist "${{ steps.release.outputs.version }}"
          "${{ runner.temp }}/resonance-signing-evidence/macos.json"

      - name: Upload macOS artifact
        if: ${{ !inputs.release_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Resonance-macOS-${{ github.sha }}
          path: |
            installers/macos/dist/Resonance-macOS.zip
            installers/macos/dist/Resonance-macOS.zip.sha256
            installers/macos/dist/Resonance-Installer.pkg
            installers/macos/dist/latest-mac.json
          if-no-files-found: error

      - name: Upload macOS release candidate
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-macos
          path: |
            installers/macos/dist/Resonance-macOS.zip
            installers/macos/dist/Resonance-macOS.zip.sha256
            installers/macos/dist/Resonance-Installer.pkg
            installers/macos/dist/latest-mac.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload macOS signing evidence
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signing-macos
          path: ${{ runner.temp }}/resonance-signing-evidence/macos.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Remove temporary signing material
        if: ${{ always() && inputs.release_candidate && inputs.production_signing }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/resonance-release-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/resonance-app-signing.p12" \
            "$RUNNER_TEMP/resonance-installer-signing.p12" \
            "$RUNNER_TEMP/resonance-notary-key.p8"

      - name: Save Electron packaging cache from main
        if: ${{ github.ref == 'refs/heads/main' && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
