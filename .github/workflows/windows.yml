name: Windows

on:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - "installers/windows/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "installers/windows/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/windows.yml"
  workflow_call:
    inputs:
      release_candidate:
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      build_number:
        required: false
        type: string
        default: ""
      source_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.release_candidate || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Verify candidate version
        if: ${{ inputs.release_candidate }}
        shell: bash
        working-directory: .
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          node scripts/release-version.mjs --check
          read -r VERSION BUILD < <(node -e 'const value = require("./release/version.json"); console.log(value.version, value.build)')
          [[ "$VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$BUILD" == "$EXPECTED_BUILD" ]]

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build installer
        run: pnpm run installer:win

      - name: Verify Windows release manifest
        if: ${{ inputs.release_candidate }}
        shell: bash
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep -Eq "^version: ['\"]?${VERSION}['\"]?$" installers/windows/dist/latest.yml
          grep -Eq "^path: ['\"]?Resonance-Setup-${VERSION}\\.exe['\"]?$" installers/windows/dist/latest.yml

      - name: Upload installer artifact
        if: ${{ !inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: Resonance-Windows-${{ github.sha }}
          path: |
            installers/windows/dist/Resonance-Setup-*.exe
            installers/windows/dist/Resonance-Setup-*.exe.blockmap
            installers/windows/dist/latest.yml
          if-no-files-found: error

      - name: Upload Windows release candidate
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            installers/windows/dist/Resonance-Setup-${{ inputs.version }}.exe
            installers/windows/dist/Resonance-Setup-${{ inputs.version }}.exe.blockmap
            installers/windows/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
          overwrite: true
