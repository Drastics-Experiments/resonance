name: iPhone Installer

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "installers/windows/iphone-installer/**"
      - "scripts/package-ios-device-ipa.sh"
      - ".github/workflows/iphone-installer.yml"
  pull_request:
    paths:
      - "ios/**"
      - "installers/windows/iphone-installer/**"
      - "scripts/package-ios-device-ipa.sh"
      - ".github/workflows/iphone-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Test installer UI
        working-directory: installers/windows/iphone-installer
        run: node --test tests/*.test.mjs

      - name: Test installer backend
        working-directory: installers/windows/iphone-installer/src-tauri
        run: cargo test --locked

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          projectPath: installers/windows/iphone-installer
          args: --bundles nsis --locked

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Resonance-iPhone-Installer-Windows-${{ github.sha }}
          path: installers/windows/iphone-installer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
