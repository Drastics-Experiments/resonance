name: UI Benchmarks

on:
  push:
    branches:
      - agent/ui-quality-performance
    paths:
      - "android/**"
      - "windows/**"
      - "benchmarks/**"
      - ".github/workflows/ui-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Run algorithm benchmarks
        run: |
          mkdir -p benchmark-results
          node benchmarks/run-ui-data-benchmarks.mjs benchmark-results/ui-data.json

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Validate Windows renderer quality layer
        working-directory: windows
        run: node --test test/ui-quality.test.js

      - name: Print benchmark results
        run: |
          jq . benchmark-results/ui-data.json
          node benchmarks/summarize-ui-benchmarks.mjs benchmark-results/ui-data.json \
            | tee benchmark-results/summary.md
          cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-benchmarks-${{ github.sha }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 14
