name: Android

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/android.yml"
  workflow_call:
    inputs:
      release_candidate:
        description: Package release-ready assets for the centralized candidate workflow.
        required: false
        type: boolean
        default: false
      production_signing:
        description: Permit production signing only from the protected direct-release workflow.
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      build_number:
        required: false
        type: string
        default: ""
      version_override:
        description: Apply version and build inputs inside the runner without changing repository source.
        required: false
        type: boolean
        default: false
      source_ref:
        required: false
        type: string
        default: ""
    secrets:
      RESONANCE_ANDROID_KEYSTORE_BASE64:
        required: false
      RESONANCE_ANDROID_KEYSTORE_PASSWORD:
        required: false
      RESONANCE_ANDROID_KEY_ALIAS:
        required: false
      RESONANCE_ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.release_candidate || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.production_signing && 'production-release' || '' }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Apply direct candidate version
        if: ${{ inputs.release_candidate && inputs.version_override }}
        shell: bash
        working-directory: .
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: node scripts/release-version.mjs --set "$EXPECTED_VERSION" "$EXPECTED_BUILD"

      - name: Verify candidate version
        if: ${{ inputs.release_candidate }}
        shell: bash
        working-directory: .
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          node scripts/release-version.mjs --check
          read -r VERSION BUILD < <(node -e 'const value = require("./release/version.json"); console.log(value.version, value.build)')
          [[ "$VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$BUILD" == "$EXPECTED_BUILD" ]]

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Android release-signing secrets
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RESONANCE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RESONANCE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RESONANCE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RESONANCE_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::The four RESONANCE_ANDROID release-signing secrets are required for release candidates."
            exit 1
          fi

      - name: Decode Android release keystore
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RESONANCE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/resonance-release.jks"
          chmod 600 "$RUNNER_TEMP/resonance-release.jks"

      - name: Validate and build Android app
        if: ${{ !inputs.release_candidate }}
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Validate and build signed Android release
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        env:
          RESONANCE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/resonance-release.jks
          RESONANCE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RESONANCE_ANDROID_KEYSTORE_PASSWORD }}
          RESONANCE_ANDROID_KEY_ALIAS: ${{ secrets.RESONANCE_ANDROID_KEY_ALIAS }}
          RESONANCE_ANDROID_KEY_PASSWORD: ${{ secrets.RESONANCE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Validate and build unsigned Android release candidate
        if: ${{ inputs.release_candidate && !inputs.production_signing }}
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Upload debug APK
        if: ${{ !inputs.release_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Resonance-Android-Debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package Android release candidate
        if: ${{ inputs.release_candidate }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PRODUCTION_SIGNING: ${{ inputs.production_signing }}
        run: |
          METADATA="app/build/outputs/apk/release/output-metadata.json"
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION_NAME="$(jq -r '.elements[0].versionName' "$METADATA")"
          VERSION_CODE="$(jq -r '.elements[0].versionCode' "$METADATA")"
          if [[ "$VERSION_NAME" != "$VERSION" ]]; then
            echo "::error::Candidate version $VERSION does not match Android versionName $VERSION_NAME."
            exit 1
          fi
          if [[ "$PRODUCTION_SIGNING" == "true" ]]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
            if [[ -z "$APKSIGNER" ]]; then
              echo "::error::Android apksigner was not found."
              exit 1
            fi
            "$APKSIGNER" verify --verbose "$APK"
          fi
          mkdir -p ../installers/android/dist
          RELEASE_APK="Resonance-Android-${VERSION}.apk"
          cp "$APK" "../installers/android/dist/$RELEASE_APK"
          SHA256="$(sha256sum "../installers/android/dist/$RELEASE_APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c '%s' "../installers/android/dist/$RELEASE_APK")"
          printf '%s  %s\n' "$SHA256" "$RELEASE_APK" > "../installers/android/dist/$RELEASE_APK.sha256"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${RELEASE_APK}" \
            --arg sha256 "$SHA256" \
            --argjson sizeBytes "$SIZE_BYTES" \
            '{schemaVersion: 1, versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, sizeBytes: $sizeBytes}' \
            > ../installers/android/dist/latest-android.json

      - name: Upload Android release candidate
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-android-${{ inputs.production_signing && 'production' || 'pr' }}
          path: |
            installers/android/dist/Resonance-Android-${{ inputs.version }}.apk
            installers/android/dist/Resonance-Android-${{ inputs.version }}.apk.sha256
            installers/android/dist/latest-android.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
