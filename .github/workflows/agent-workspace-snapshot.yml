name: Agent workspace snapshot

on:
  push:
    branches:
      - agent/batched-download-speed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        run: git archive --format=zip --output=resonance-source.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: resonance-source
          path: resonance-source.zip
          if-no-files-found: error
          retention-days: 1
