name: macOS

on:
  push:
    branches:
      - main
    paths:
      - "mac/**"
      - "installers/macos/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "mac/**"
      - "installers/macos/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/macos.yml"
  workflow_call:
    inputs:
      release_candidate:
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      build_number:
        required: false
        type: string
        default: ""
      source_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.release_candidate || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve and verify release version
        id: release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
          IS_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          node scripts/release-version.mjs --github-output >> "$GITHUB_OUTPUT"
          read -r VERSION BUILD < <(node -e 'const value = require("./release/version.json"); console.log(value.version, value.build)')
          if [[ "$IS_CANDIDATE" == "true" ]]; then
            [[ "$VERSION" == "$EXPECTED_VERSION" ]]
            [[ "$BUILD" == "$EXPECTED_BUILD" ]]
          fi

      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          SWIFT_COMPONENTS="$(swift --version | sed -nE 's/.*Apple Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p')"
          read -r SWIFT_MAJOR SWIFT_MINOR <<< "$SWIFT_COMPONENTS"
          (( SWIFT_MAJOR > 6 || (SWIFT_MAJOR == 6 && SWIFT_MINOR >= 2) ))
          swift package --package-path mac dump-package >/dev/null

      - name: Run macOS tests
        run: mac/scripts/test.sh

      - name: Build app and installer
        run: mac/scripts/build-release.sh
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build }}

      - name: Upload macOS artifact
        if: ${{ !inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: Resonance-macOS-${{ github.sha }}
          path: |
            installers/macos/dist/Resonance-macOS.zip
            installers/macos/dist/Resonance-macOS.zip.sha256
            installers/macos/dist/Resonance-Installer.pkg
            installers/macos/dist/latest-mac.json
          if-no-files-found: error

      - name: Upload macOS release candidate
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            installers/macos/dist/Resonance-macOS.zip
            installers/macos/dist/Resonance-macOS.zip.sha256
            installers/macos/dist/Resonance-Installer.pkg
            installers/macos/dist/latest-mac.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
