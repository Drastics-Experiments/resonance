name: Agent workspace snapshot

on:
  push:
    branches:
      - agent/batched-download-speed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batched-download-speed
      - name: Package exact source tree
        run: git archive --format=zip --output=resonance-source.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: resonance-source-${{ github.run_id }}
          path: resonance-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Publish workflow run identifier
        run: |
          mkdir -p .agent
          printf '%s\n' "$GITHUB_RUN_ID" > .agent/snapshot-run-id.txt
          printf '%s\n' "resonance-source-$GITHUB_RUN_ID" > .agent/snapshot-artifact-name.txt
          git config user.name "Resonance Agent"
          git config user.email "resonance-agent@users.noreply.github.com"
          git add .agent/snapshot-run-id.txt .agent/snapshot-artifact-name.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish source snapshot handle [skip ci]"
          git push origin HEAD:agent/batched-download-speed
