[package]
name = "resonance-iphone-installer"
version = "1.0.0"
description = "Install Resonance on an iPhone from Windows"
authors = ["Resonance"]
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "resonance_iphone_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
hex = "0.4"
idevice = { version = "0.1.61", default-features = false, features = ["ring", "usbmuxd"] }
isideload = { git = "https://github.com/nab138/isideload", rev = "0f4ffaf22212781810491156113f6160504880cc", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tempfile = "3"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
