name: Address PR 60 cancellation feedback v2

on:
  push:
    branches:
      - agent/optimize-batched-downloads
    paths:
      - .github/workflows/address-pr60-cancellation-feedback-v2.yml

permissions:
  contents: write

jobs:
  apply-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/optimize-batched-downloads
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply, test, and publish the review fix
        shell: bash
        run: |
          set +e
          REPORT=.github/address-pr60-cancellation-feedback-report.txt
          : > "$REPORT"
          echo "source=$(git rev-parse HEAD)" >> "$REPORT"

          python3 - <<'PY' >> "$REPORT" 2>&1
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          server_download = Path("windows/server-download.cjs")
          server_source = server_download.read_text(encoding="utf-8")
          if "function serverDownloadBatchResultSnapshot(" not in server_source:
              marker = "\n\nfunction createServerDownloadPresentationCoordinator(itemCount, publish) {"
              helper = dedent('''\
              \n\nfunction serverDownloadBatchResultSnapshot({
                downloadedByIndex = [],
                replacedTrackIDsByIndex = [],
                failedByIndex = [],
              } = {}) {
                const compact = (values) => Array.isArray(values) ? values.filter(Boolean) : [];
                return {
                  downloaded: compact(downloadedByIndex),
                  replacedTrackIDs: compact(replacedTrackIDsByIndex),
                  failed: compact(failedByIndex),
                };
              }
              ''')
              replace_once(server_download, marker, helper + marker, "batch-result helper insertion")
          server_source = server_download.read_text(encoding="utf-8")
          if "  serverDownloadBatchResultSnapshot,\n" not in server_source:
              replace_once(
                  server_download,
                  "  runServerDownloadPool,\n  createServerCatalogSnapshotStore,",
                  "  runServerDownloadPool,\n  serverDownloadBatchResultSnapshot,\n  createServerCatalogSnapshotStore,",
                  "batch-result helper export",
              )

          main = Path("windows/main.cjs")
          main_source = main.read_text(encoding="utf-8")
          if "  serverDownloadBatchResultSnapshot,\n" not in main_source:
              replace_once(
                  main,
                  "  retryServerDownload,\n  runServerDownloadPool,\n  serverDownloadCanUseCatalogMetadata,",
                  "  retryServerDownload,\n  runServerDownloadPool,\n  serverDownloadBatchResultSnapshot,\n  serverDownloadCanUseCatalogMetadata,",
                  "batch-result helper import",
              )

          main_source = main.read_text(encoding="utf-8")
          old_outer = dedent('''\
            let policyLease = null;
            let catalog = null;
            const downloaded = [];
            const replacedTrackIDs = [];
            const failed = [];
            try {
          ''')
          new_outer = dedent('''\
            let policyLease = null;
            let catalog = null;
            let downloadedByIndex = [];
            let replacedTrackIDsByIndex = [];
            let failedByIndex = [];
            const completedBatchResult = () => serverDownloadBatchResultSnapshot({
              downloadedByIndex,
              replacedTrackIDsByIndex,
              failedByIndex,
            });
            try {
          ''')
          if old_outer in main_source:
              replace_once(main, old_outer, new_outer, "outer batch-result state")
          elif new_outer not in main_source:
              raise RuntimeError("outer batch-result state was not recognized")

          main_source = main.read_text(encoding="utf-8")
          old_arrays = dedent('''\
            const downloadedByIndex = new Array(pendingDownloads.length);
            const replacedTrackIDsByIndex = new Array(pendingDownloads.length);
            const failedByIndex = new Array(pendingDownloads.length);
          ''')
          new_arrays = dedent('''\
            downloadedByIndex = new Array(pendingDownloads.length);
            replacedTrackIDsByIndex = new Array(pendingDownloads.length);
            failedByIndex = new Array(pendingDownloads.length);
          ''')
          if old_arrays in main_source:
              replace_once(main, old_arrays, new_arrays, "per-index batch-result initialization")
          elif new_arrays not in main_source:
              raise RuntimeError("per-index batch-result initialization was not recognized")

          main_source = main.read_text(encoding="utf-8")
          old_return = dedent('''\
            downloaded.push(...downloadedByIndex.filter(Boolean));
            replacedTrackIDs.push(...replacedTrackIDsByIndex.filter(Boolean));
            failed.push(...failedByIndex.filter(Boolean));
            return { catalog, downloaded, replacedTrackIDs, failed };
            } catch (error) {
              if (error?.name === "AbortError") return { catalog, downloaded, replacedTrackIDs, failed, cancelled: true };
          ''')
          new_return = dedent('''\
            return { catalog, ...completedBatchResult() };
            } catch (error) {
              if (error?.name === "AbortError") {
                return { catalog, ...completedBatchResult(), cancelled: true };
              }
          ''')
          if old_return in main_source:
              replace_once(main, old_return, new_return, "success and cancellation reconciliation")
          elif new_return not in main_source:
              raise RuntimeError("success and cancellation reconciliation was not recognized")

          core_test = Path("windows/test/core.test.js")
          core_source = core_test.read_text(encoding="utf-8")
          if "  serverDownloadBatchResultSnapshot,\n" not in core_source:
              replace_once(
                  core_test,
                  "  runServerDownloadPool,\n  retryServerDownload,",
                  "  runServerDownloadPool,\n  serverDownloadBatchResultSnapshot,\n  retryServerDownload,",
                  "core-test helper import",
              )
          core_source = core_test.read_text(encoding="utf-8")
          regression_name = 'test("cancelled download pools retain every completed result bucket"'
          if regression_name not in core_source:
              regression = dedent('''\
              test("cancelled download pools retain every completed result bucket", async () => {
                const controller = new AbortController();
                const downloadedByIndex = new Array(2);
                const replacedTrackIDsByIndex = new Array(2);
                const failedByIndex = new Array(2);
                let markFirstComplete;
                const firstComplete = new Promise((resolve) => { markFirstComplete = resolve; });

                await assert.rejects(
                  runServerDownloadPool([0, 1], async (_value, index) => {
                    if (index === 0) {
                      downloadedByIndex[index] = { id: "downloaded-a" };
                      replacedTrackIDsByIndex[index] = "replaced-a";
                      markFirstComplete();
                      return;
                    }
                    await firstComplete;
                    failedByIndex[index] = { id: "failed-b", message: "failed before cancellation" };
                    controller.abort();
                  }, { concurrency: 2, signal: controller.signal }),
                  { name: "AbortError" },
                );

                assert.deepEqual(serverDownloadBatchResultSnapshot({
                  downloadedByIndex,
                  replacedTrackIDsByIndex,
                  failedByIndex,
                }), {
                  downloaded: [{ id: "downloaded-a" }],
                  replacedTrackIDs: ["replaced-a"],
                  failed: [{ id: "failed-b", message: "failed before cancellation" }],
                });
              });

              ''')
              replace_once(
                  core_test,
                  'test("catalog metadata fast path requires resolved context and duration", () => {',
                  regression + 'test("catalog metadata fast path requires resolved context and duration", () => {',
                  "cancellation regression insertion",
              )

          hardening = Path("windows/test/hardening.test.js")
          hardening_source = hardening.read_text(encoding="utf-8")
          assertion = '  assert.match(serverSyncHandler, /const completedBatchResult = \\(\\) => serverDownloadBatchResultSnapshot\\(\\{[\\s\\S]+downloadedByIndex,[\\s\\S]+replacedTrackIDsByIndex,[\\s\\S]+failedByIndex/);\n'
          cancellation_assertion = '  assert.match(serverSyncHandler, /if \\(error\\?\\.name === "AbortError"\\) \\{\\s+return \\{ catalog, \\.\\.\\.completedBatchResult\\(\\), cancelled: true \\};/);\n'
          if assertion not in hardening_source:
              anchor = '  assert.match(serverSyncHandler, /completed \\+= 1;[\\s\\S]+if \\(itemSucceeded\\) \\{/);\n'
              replace_once(
                  hardening,
                  anchor,
                  assertion + cancellation_assertion + anchor,
                  "hardening cancellation assertions",
              )

          print("patch_applied=1")
          PY
          PATCH_STATUS=$?
          echo "patch_status=$PATCH_STATUS" >> "$REPORT"

          CHECK_STATUS=125
          INSTALL_STATUS=125
          TEST_STATUS=125
          if [[ $PATCH_STATUS -eq 0 ]]; then
            git diff --check >> "$REPORT" 2>&1
            CHECK_STATUS=$?
            node --check windows/main.cjs >> "$REPORT" 2>&1
            MAIN_CHECK_STATUS=$?
            node --check windows/server-download.cjs >> "$REPORT" 2>&1
            SERVER_CHECK_STATUS=$?
            if [[ $CHECK_STATUS -eq 0 && $MAIN_CHECK_STATUS -eq 0 && $SERVER_CHECK_STATUS -eq 0 ]]; then
              (cd windows && npm ci --no-audit --no-fund) >> "$REPORT" 2>&1
              INSTALL_STATUS=$?
              if [[ $INSTALL_STATUS -eq 0 ]]; then
                (cd windows && npm test) >> "$REPORT" 2>&1
                TEST_STATUS=$?
              fi
            fi
          fi
          printf '\nsummary patch=%s diff_check=%s install=%s test=%s\n' \
            "$PATCH_STATUS" "$CHECK_STATUS" "$INSTALL_STATUS" "$TEST_STATUS" >> "$REPORT"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ $PATCH_STATUS -eq 0 && $CHECK_STATUS -eq 0 && $INSTALL_STATUS -eq 0 && $TEST_STATUS -eq 0 ]]; then
            git add \
              windows/main.cjs \
              windows/server-download.cjs \
              windows/test/core.test.js \
              windows/test/hardening.test.js
            git commit -m 'Fix cancellation reconciliation for completed downloads'
          else
            git add "$REPORT"
            git commit -m 'chore: record cancellation feedback patch failure'
          fi
          git pull --rebase origin agent/optimize-batched-downloads
          git push origin HEAD:agent/optimize-batched-downloads
          exit 0
