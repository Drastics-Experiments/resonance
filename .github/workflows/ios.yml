name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/ios.yml"
  workflow_call:
    inputs:
      release_candidate:
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      build_number:
        required: false
        type: string
        default: ""
      source_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.release_candidate || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Verify candidate version
        if: ${{ inputs.release_candidate }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          node scripts/release-version.mjs --check
          read -r VERSION BUILD < <(node -e 'const value = require("./release/version.json"); console.log(value.version, value.build)')
          [[ "$VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$BUILD" == "$EXPECTED_BUILD" ]]

      - name: Verify Xcode toolchain
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')"
          (( XCODE_MAJOR >= 26 ))

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/LikedSongsMobile.xcodeproj \
            -scheme LikedSongsMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/ResonanceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify built iOS version
        if: ${{ inputs.release_candidate }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          PLIST="$RUNNER_TEMP/ResonanceDerivedData/Build/Products/Debug-iphonesimulator/Resonance.app/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" == "$EXPECTED_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" == "$EXPECTED_BUILD" ]]

      - name: Upload simulator app
        if: ${{ !inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: Resonance-iOS-Simulator-${{ github.sha }}
          path: ${{ runner.temp }}/ResonanceDerivedData/Build/Products/Debug-iphonesimulator/Resonance.app
          if-no-files-found: error

      - name: Package iOS Simulator release candidate
        if: ${{ inputs.release_candidate }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p installers/ios/dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ResonanceDerivedData/Build/Products/Debug-iphonesimulator/Resonance.app" \
            "installers/ios/dist/Resonance-iOS-Simulator-${VERSION}.zip"
          cd installers/ios/dist
          shasum -a 256 "Resonance-iOS-Simulator-${VERSION}.zip" > "Resonance-iOS-Simulator-${VERSION}.zip.sha256"

      - name: Upload iOS release candidate
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: |
            installers/ios/dist/Resonance-iOS-Simulator-${{ inputs.version }}.zip
            installers/ios/dist/Resonance-iOS-Simulator-${{ inputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: true
