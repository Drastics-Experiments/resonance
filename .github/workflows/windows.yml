name: Windows

on:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - "installers/windows/**"
      - "release/version.json"
      - "scripts/release-now.mjs"
      - "scripts/release-now.test.mjs"
      - "scripts/release-version.mjs"
      - "scripts/record-desktop-signing-evidence.mjs"
      - "scripts/validate-release-assets.mjs"
      - "scripts/validate-release-assets.test.mjs"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "installers/windows/**"
      - "release/version.json"
      - "scripts/release-now.mjs"
      - "scripts/release-now.test.mjs"
      - "scripts/release-version.mjs"
      - "scripts/record-desktop-signing-evidence.mjs"
      - "scripts/validate-release-assets.mjs"
      - "scripts/validate-release-assets.test.mjs"
      - ".github/workflows/windows.yml"
  workflow_call:
    inputs:
      release_candidate:
        required: false
        type: boolean
        default: false
      production_signing:
        description: Permit production signing only from the protected direct-release workflow.
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      build_number:
        required: false
        type: string
        default: ""
      version_override:
        description: Apply version and build inputs inside the runner without changing repository source.
        required: false
        type: boolean
        default: false
      source_ref:
        required: false
        type: string
        default: ""
    secrets:
      RESONANCE_WINDOWS_CERTIFICATE_BASE64:
        required: false
      RESONANCE_WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      RESONANCE_WINDOWS_CERTIFICATE_SHA1:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.release_candidate || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: windows-latest
    environment: ${{ inputs.production_signing && 'production-release' || '' }}
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Apply direct candidate version
        if: ${{ inputs.release_candidate && inputs.version_override }}
        shell: bash
        working-directory: .
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: node scripts/release-version.mjs --set "$EXPECTED_VERSION" "$EXPECTED_BUILD"

      - name: Verify candidate version
        if: ${{ inputs.release_candidate }}
        shell: bash
        working-directory: .
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          node scripts/release-version.mjs --check
          read -r VERSION BUILD < <(node -e 'const value = require("./release/version.json"); console.log(value.version, value.build)')
          [[ "$VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$BUILD" == "$EXPECTED_BUILD" ]]

      - name: Validate Authenticode signing secrets
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        shell: pwsh
        working-directory: .
        env:
          CERTIFICATE_BASE64: ${{ secrets.RESONANCE_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.RESONANCE_WINDOWS_CERTIFICATE_PASSWORD }}
          CERTIFICATE_SHA1: ${{ secrets.RESONANCE_WINDOWS_CERTIFICATE_SHA1 }}
        run: |
          $required = @("CERTIFICATE_BASE64", "CERTIFICATE_PASSWORD", "CERTIFICATE_SHA1")
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required Windows release-signing secret: $name"
            }
          }
          if (($env:CERTIFICATE_SHA1 -replace '[^0-9A-Fa-f]', '').Length -ne 40) {
            throw "RESONANCE_WINDOWS_CERTIFICATE_SHA1 must be a SHA-1 certificate thumbprint."
          }

      - name: Configure Authenticode signing
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        shell: pwsh
        working-directory: .
        env:
          CERTIFICATE_BASE64: ${{ secrets.RESONANCE_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "resonance-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          if ((Get-Item $certificatePath).Length -lt 1) {
            throw "The decoded Windows code-signing certificate is empty."
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - name: Restore Electron packaging cache
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: resonance-windows-electron-${{ hashFiles('windows/pnpm-lock.yaml') }}
          restore-keys: |
            resonance-windows-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run release policy tests
        working-directory: .
        run: node --test scripts/release-now.test.mjs scripts/validate-release-assets.test.mjs

      - name: Build unsigned development installer
        if: ${{ !inputs.release_candidate || !inputs.production_signing }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run installer:win

      - name: Verify unsigned installer state
        if: ${{ !inputs.release_candidate || !inputs.production_signing }}
        shell: pwsh
        working-directory: .
        run: |
          $installers = @(Get-ChildItem "installers/windows/dist/Resonance-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one unsigned Windows installer, found $($installers.Count)."
          }
          $application = Resolve-Path "installers/windows/dist/win-unpacked/Resonance.exe"
          foreach ($file in @($application.Path, $installers[0].FullName)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "NotSigned") {
              throw "$file must be explicitly unsigned, but Authenticode reported $($signature.Status)."
            }
          }

      - name: Build signed release candidate
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        env:
          WIN_CSC_LINK: ${{ runner.temp }}\resonance-code-signing.pfx
          WIN_CSC_KEY_PASSWORD: ${{ secrets.RESONANCE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm exec electron-builder --win nsis --x64 --publish never --config.forceCodeSigning=true --config.extraMetadata.resonanceUpdateAuthenticity=production

      - name: Verify packaged startup modules and update policy
        shell: pwsh
        env:
          EXPECTED_UPDATE_AUTHENTICITY: ${{ inputs.release_candidate && inputs.production_signing && 'production' || 'unsigned' }}
        run: |
          $application = Resolve-Path "../installers/windows/dist/win-unpacked/Resonance.exe"
          $archive = Resolve-Path "../installers/windows/dist/win-unpacked/resources/app.asar"
          $validator = Resolve-Path "validate-packaged-app.cjs"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $validation = Start-Process `
            -FilePath $application.Path `
            -ArgumentList @($validator.Path, $archive.Path, $env:EXPECTED_UPDATE_AUTHENTICITY) `
            -NoNewWindow `
            -Wait `
            -PassThru
          if ($validation.ExitCode -ne 0) {
            throw "The packaged Windows startup-module validation failed."
          }

      - name: Verify Authenticode signatures and record evidence
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        shell: pwsh
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_CERTIFICATE_SHA1: ${{ secrets.RESONANCE_WINDOWS_CERTIFICATE_SHA1 }}
        run: |
          $installer = Resolve-Path "installers/windows/dist/Resonance-Setup-$env:VERSION.exe"
          $application = Resolve-Path "installers/windows/dist/win-unpacked/Resonance.exe"
          $expectedThumbprint = ($env:EXPECTED_CERTIFICATE_SHA1 -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()

          $signToolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($null -eq $signToolCommand) {
            $signToolCommand = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName |
              Select-Object -Last 1
          }
          if ($null -eq $signToolCommand) {
            throw "signtool.exe was not found on the Windows runner."
          }
          $signToolPath = if ($signToolCommand.PSObject.Properties.Name -contains "Source") {
            $signToolCommand.Source
          } else {
            $signToolCommand.FullName
          }

          foreach ($path in @($application.Path, $installer.Path)) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode validation failed for $path with status $($signature.Status)."
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Authenticode did not return a signer certificate for $path."
            }
            if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) {
              throw "The Authenticode signer for $path is not the configured release certificate."
            }
            if ($signature.SignerCertificate.Subject -eq $signature.SignerCertificate.Issuer) {
              throw "The Authenticode signer for $path is self-signed."
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "The Authenticode signature for $path does not have a trusted timestamp."
            }
            & $signToolPath verify /pa /all /v $path
            if ($LASTEXITCODE -ne 0) {
              throw "signtool trust-chain validation failed for $path."
            }
          }

          node scripts/record-desktop-signing-evidence.mjs `
            windows installers/windows/dist "$env:VERSION" `
            "$env:RUNNER_TEMP/resonance-signing-evidence/windows.json"

      - name: Verify Windows release manifest
        if: ${{ inputs.release_candidate }}
        shell: bash
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep -Eq "^version: ['\"]?${VERSION}['\"]?$" installers/windows/dist/latest.yml
          grep -Eq "^path: ['\"]?Resonance-Setup-${VERSION}\\.exe['\"]?$" installers/windows/dist/latest.yml

      - name: Upload installer artifact
        if: ${{ !inputs.release_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Resonance-Windows-${{ github.sha }}
          path: |
            installers/windows/dist/Resonance-Setup-*.exe
            installers/windows/dist/Resonance-Setup-*.exe.blockmap
            installers/windows/dist/latest.yml
          if-no-files-found: error

      - name: Upload Windows release candidate
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-windows
          path: |
            installers/windows/dist/Resonance-Setup-${{ inputs.version }}.exe
            installers/windows/dist/Resonance-Setup-${{ inputs.version }}.exe.blockmap
            installers/windows/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload Windows signing evidence
        if: ${{ inputs.release_candidate && inputs.production_signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signing-windows
          path: ${{ runner.temp }}/resonance-signing-evidence/windows.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Remove temporary signing material
        if: ${{ always() && inputs.release_candidate && inputs.production_signing }}
        shell: pwsh
        working-directory: .
        run: Remove-Item "$env:RUNNER_TEMP/resonance-code-signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Save Electron packaging cache from main
        if: ${{ github.ref == 'refs/heads/main' && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
