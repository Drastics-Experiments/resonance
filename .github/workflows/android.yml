name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "release/version.json"
      - "scripts/release-version.mjs"
      - ".github/workflows/android.yml"
  workflow_call:
    inputs:
      release_candidate:
        description: Package release-ready assets for the centralized candidate workflow.
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      build_number:
        required: false
        type: string
        default: ""
      source_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.release_candidate || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Verify candidate version
        if: ${{ inputs.release_candidate }}
        shell: bash
        working-directory: .
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          node scripts/release-version.mjs --check
          read -r VERSION BUILD < <(node -e 'const value = require("./release/version.json"); console.log(value.version, value.build)')
          [[ "$VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$BUILD" == "$EXPECTED_BUILD" ]]

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate and build Android app
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: ${{ !inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: Resonance-Android-Debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package Android release candidate
        if: ${{ inputs.release_candidate }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p ../installers/android/dist
          cp app/build/outputs/apk/debug/app-debug.apk "../installers/android/dist/Resonance-Android-${VERSION}.apk"
          cd ../installers/android/dist
          sha256sum "Resonance-Android-${VERSION}.apk" > "Resonance-Android-${VERSION}.apk.sha256"

      - name: Upload Android release candidate
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            installers/android/dist/Resonance-Android-${{ inputs.version }}.apk
            installers/android/dist/Resonance-Android-${{ inputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: true
