name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.1.2.
        required: true
        type: string
      candidate_sha:
        description: Commit SHA used to build the successful candidate.
        required: true
        type: string
      merged_sha:
        description: Exact protected-main SHA that was built; it must equal candidate_sha.
        required: true
        type: string
      candidate_run_id:
        description: Exact successful direct-release workflow run that produced the candidate.
        required: true
        type: string
      request_id:
        description: Exact Release Studio request identifier for the candidate run.
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: resonance-release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified candidate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production-release

    steps:
      - name: Resolve release inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_MERGED_SHA: ${{ inputs.merged_sha }}
        run: |
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          TAG="$INPUT_TAG"
          CANDIDATE_SHA="$INPUT_CANDIDATE_SHA"
          MERGED_SHA="$INPUT_MERGED_SHA"

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGED_SHA" == "$CANDIDATE_SHA" ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.merged_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact direct candidate run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$INPUT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9-]{8,64}$ ]]
          RUN_JSON="$(gh api "repos/${REPOSITORY}/actions/runs/${INPUT_RUN_ID}")"
          [[ "$(jq -r '.path' <<< "$RUN_JSON")" == ".github/workflows/direct-release-build.yml" ]]
          [[ "$(jq -r '.event' <<< "$RUN_JSON")" == "workflow_dispatch" ]]
          [[ "$(jq -r '.status' <<< "$RUN_JSON")" == "completed" ]]
          [[ "$(jq -r '.conclusion' <<< "$RUN_JSON")" == "success" ]]
          [[ "$(jq -r '.head_sha' <<< "$RUN_JSON")" == "$CANDIDATE_SHA" ]]
          echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact candidate assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-assets-*
          path: candidate/assets
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download exact candidate provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-provenance-direct-${{ steps.release.outputs.tag }}-${{ steps.release.outputs.candidate_sha }}-${{ inputs.request_id }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate assets and provenance
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          node scripts/release-version.mjs --check
          read -r POLICY_SCHEMA POLICY_VERSION POLICY_BUILD DESKTOP_SIGNING < <(node -e 'const value = require("./release/policy.json"); console.log(value.schemaVersion, value.version, value.build, value.desktopSigning)')
          [[ "$POLICY_SCHEMA" == "1" ]]
          [[ "$POLICY_VERSION" == "$VERSION" ]]
          [[ "$DESKTOP_SIGNING" == "production" ]]
          node scripts/validate-release-assets.mjs \
            candidate/assets "$VERSION" \
            --signing-evidence candidate/signing
          git fetch --no-tags origin "$CANDIDATE_SHA"
          export SOURCE_TREE="$(git rev-parse "${CANDIDATE_SHA}^{tree}")"
          export BUILD="$(node -e 'const value = require("./release/version.json"); process.stdout.write(String(value.build))')"
          [[ "$POLICY_BUILD" == "$BUILD" ]]
          export DESKTOP_SIGNING
          node --input-type=module -e '
            import fs from "node:fs";
            const value = JSON.parse(fs.readFileSync("candidate/candidate.json", "utf8"));
            const expected = {
              version: process.env.VERSION,
              build: Number(process.env.BUILD),
              tag: process.env.TAG,
              sourceSha: process.env.CANDIDATE_SHA,
              sourceTree: process.env.SOURCE_TREE,
              workflowRunId: Number(process.env.CANDIDATE_RUN_ID),
              requestId: process.env.REQUEST_ID,
              desktopSigning: process.env.DESKTOP_SIGNING,
            };
            for (const [key, expectedValue] of Object.entries(expected)) {
              if (value[key] !== expectedValue) {
                throw new Error(`candidate ${key} is ${value[key]}, expected ${expectedValue}`);
              }
            }
          '

      - name: Verify merged source and release state
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          MERGED_SHA: ${{ steps.release.outputs.merged_sha }}
        run: |
          [[ "$CANDIDATE_SHA" == "$MERGED_SHA" ]]
          RELEASE_TARGET="$CANDIDATE_SHA"

          EXISTING="$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,assets,url 2>/dev/null || true)"
          if [[ -n "$EXISTING" ]]; then
            [[ "$(jq -r '.isDraft' <<< "$EXISTING")" == "false" ]]
            mapfile -t ACTUAL_ASSETS < <(jq -r '.assets[].name' <<< "$EXISTING" | sort)
            EXPECTED_ASSETS=(
              Resonance-Installer.pkg
              Resonance-macOS.zip
              Resonance-macOS.zip.sha256
              latest-mac.json
              "Resonance-Setup-${VERSION}.exe"
              "Resonance-Setup-${VERSION}.exe.blockmap"
              latest.yml
              "Resonance-iPhone-Installer-Windows-${VERSION}.exe"
              "Resonance-iPhone-Installer-Windows-${VERSION}.exe.sha256"
              "Resonance-iPhone-Installer-macOS-${VERSION}.zip"
              "Resonance-iPhone-Installer-macOS-${VERSION}.zip.sha256"
              "Resonance-Android-${VERSION}.apk"
              "Resonance-Android-${VERSION}.apk.sha256"
              latest-android.json
              "Resonance-iOS-Simulator-${VERSION}.zip"
              "Resonance-iOS-Simulator-${VERSION}.zip.sha256"
              "Resonance-iOS-Device-${VERSION}.ipa"
              "Resonance-iOS-Device-${VERSION}.ipa.sha256"
            )
            mapfile -t EXPECTED_ASSETS < <(printf '%s\n' "${EXPECTED_ASSETS[@]}" | sort)
            [[ "${EXPECTED_ASSETS[*]}" == "${ACTUAL_ASSETS[*]}" ]]
            TAG_TARGET="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
            [[ "$TAG_TARGET" == "$RELEASE_TARGET" ]]
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Published release already verified: $(jq -r '.url' <<< "$EXISTING")"
            exit 0
          fi

          if gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} exists without a published release; refusing to overwrite it." >&2
            exit 1
          fi

          echo "already_published=false" >> "$GITHUB_OUTPUT"
          echo "release_target=$RELEASE_TARGET" >> "$GITHUB_OUTPUT"

      - name: Publish complete release atomically
        if: ${{ steps.verify.outputs.already_published != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TARGET: ${{ steps.verify.outputs.release_target }}
        run: |
          assets=(candidate/assets/*)
          [[ "${#assets[@]}" -eq 18 ]]
          DESKTOP_SIGNING="$(node -e 'const value = require("./release/policy.json"); process.stdout.write(value.desktopSigning)')"
          [[ "$DESKTOP_SIGNING" == "production" ]]
          release_arguments=(
            "$TAG"
            "${assets[@]}"
            --repo "$REPOSITORY"
            --target "$RELEASE_TARGET"
            --title "Resonance ${VERSION}"
            --generate-notes
            --latest
          )
          gh release create "${release_arguments[@]}"

          RELEASE_JSON="$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,assets,url)"
          [[ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" == "false" ]]
          [[ "$(jq '.assets | length' <<< "$RELEASE_JSON")" -eq 18 ]]
          TAG_TARGET="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          [[ "$TAG_TARGET" == "$RELEASE_TARGET" ]]
          echo "Published $(jq -r '.url' <<< "$RELEASE_JSON")"
