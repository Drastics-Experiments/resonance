name: Address PR 60 cancellation feedback v4

on:
  push:
    branches:
      - agent/optimize-batched-downloads
    paths:
      - .github/workflows/address-pr60-cancellation-feedback-v4.yml
      - .github/workbench/pr60-cancellation-fix.py
      - .github/workbench/pr60-cancellation-test-fix.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-batched-downloads
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - name: Patch and validate
        shell: bash
        run: |
          set +e
          REPORT=.github/address-pr60-cancellation-feedback-v4-report.txt
          : > "$REPORT"
          echo "source=$(git rev-parse HEAD)" >> "$REPORT"
          python3 .github/workbench/pr60-cancellation-fix.py >> "$REPORT" 2>&1
          PATCH=$?
          if [[ $PATCH -eq 0 ]]; then
            python3 .github/workbench/pr60-cancellation-test-fix.py >> "$REPORT" 2>&1
            PATCH=$?
          fi
          DIFF=125; INSTALL=125; TEST=125
          if [[ $PATCH -eq 0 ]]; then
            git diff --check >> "$REPORT" 2>&1; DIFF=$?
            node --check windows/main.cjs >> "$REPORT" 2>&1; MAIN=$?
            node --check windows/server-download.cjs >> "$REPORT" 2>&1; SERVER=$?
            if [[ $DIFF -eq 0 && $MAIN -eq 0 && $SERVER -eq 0 ]]; then
              (cd windows && pnpm install --frozen-lockfile) >> "$REPORT" 2>&1; INSTALL=$?
              if [[ $INSTALL -eq 0 ]]; then
                (cd windows && pnpm test) >> "$REPORT" 2>&1; TEST=$?
              fi
            fi
          fi
          printf '\nsummary patch=%s diff=%s install=%s test=%s\n' "$PATCH" "$DIFF" "$INSTALL" "$TEST" >> "$REPORT"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ $PATCH -eq 0 && $DIFF -eq 0 && $INSTALL -eq 0 && $TEST -eq 0 ]]; then
            rm -f \
              .github/address-pr60-cancellation-feedback-report.txt \
              .github/address-pr60-cancellation-feedback-v3-report.txt \
              .github/address-pr60-cancellation-feedback-v4-report.txt \
              .github/workbench/pr60-cancellation-fix.py \
              .github/workbench/pr60-cancellation-test-fix.py \
              .github/workflows/address-pr60-cancellation-feedback-v2.yml \
              .github/workflows/address-pr60-cancellation-feedback-v3.yml \
              .github/workflows/address-pr60-cancellation-feedback-v4.yml
            git add -A
            git commit -m 'Fix cancellation reconciliation for completed downloads'
          else
            git add "$REPORT"
            git commit -m 'chore: record cancellation feedback v4 failure'
          fi
          git pull --rebase origin agent/optimize-batched-downloads
          git push origin HEAD:agent/optimize-batched-downloads
          exit 0

# This comment intentionally triggers validation after updating the regression expectation.
